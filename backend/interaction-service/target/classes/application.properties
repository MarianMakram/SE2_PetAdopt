spring.application.name=interaction-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:odoo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:odoo}
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/