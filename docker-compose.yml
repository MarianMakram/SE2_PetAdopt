version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: petadopt-db
    environment:
      POSTGRES_DB: petdb
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - petadopt-network

  eureka-server:
    build: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - petadopt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - petadopt-network

  pet-service:
    build: ./backend/pet-service
    container_name: pet-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petdb
      - SPRING_DATASOURCE_USERNAME=odoo
      - SPRING_DATASOURCE_PASSWORD=odoo
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - petadopt-network

  auth-service:
    build: ./backend/authservice
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petdb
      - SPRING_DATASOURCE_USERNAME=odoo
      - SPRING_DATASOURCE_PASSWORD=odoo
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - petadopt-network

  adoption-service:
    build: ./backend/adoption-service
    container_name: adoption-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petdb
      - SPRING_DATASOURCE_USERNAME=odoo
      - SPRING_DATASOURCE_PASSWORD=odoo
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - PET_SERVICE_URL=http://pet-service:8081
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - petadopt-network

  interaction-service:
    build: ./backend/interaction-service
    container_name: interaction-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petdb
      - SPRING_DATASOURCE_USERNAME=odoo
      - SPRING_DATASOURCE_PASSWORD=odoo
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - petadopt-network

networks:
  petadopt-network:
    driver: bridge

volumes:
  postgres_data: